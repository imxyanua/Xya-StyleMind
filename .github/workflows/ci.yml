name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stylemind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stylemind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run backend tests
        run: go test ./...

      - name: Build backend
        run: go build ./...

      - name: Run backend integration tests
        env:
          TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/stylemind?sslmode=disable"
          REDIS_ADDR: "localhost:6379"
        run: go test -tags=integration ./internal/order ./internal/auth ./internal/product ./internal/cart ./internal/wishlist ./internal/review

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI types
        run: npm run generate:openapi

      - name: Verify generated OpenAPI types are committed
        run: git diff --exit-code -- src/types/openapi.ts

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:8080/api/v1"
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stylemind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stylemind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download backend dependencies
        working-directory: backend
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run migrations and seed data
        working-directory: backend
        env:
          APP_ENV: "development"
          DB_HOST: "127.0.0.1"
          DB_PORT: "5432"
          DB_USER: "postgres"
          DB_PASSWORD: "postgres"
          DB_NAME: "stylemind"
          JWT_SECRET: "change_me_for_ci"
          JWT_ISSUER: "stylemind-api"
          JWT_AUDIENCE: "stylemind-web"
          REDIS_ADDR: "127.0.0.1:6379"
          REQUEST_TIMEOUT_SECONDS: "10"
          MAX_REQUEST_BODY_BYTES: "1048576"
          CORS_ALLOWED_ORIGINS: "http://127.0.0.1:3000,http://localhost:3000"
        run: go run ./cmd/seed

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          E2E_DB_HOST: "127.0.0.1"
          E2E_DB_PORT: "5432"
          E2E_DB_USER: "postgres"
          E2E_DB_PASSWORD: "postgres"
          E2E_DB_NAME: "stylemind"
          E2E_REDIS_ADDR: "127.0.0.1:6379"
          NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:8080/api/v1"
        run: npm run test:e2e
