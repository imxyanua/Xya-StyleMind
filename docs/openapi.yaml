          type: object
          additionalProperties:
            type: integer
            format: int64
          example:
            '1': 0
            '2': 1
            '3': 2
            '4': 4
            '5': 5
    RatingSummaryResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/RatingSummary'
