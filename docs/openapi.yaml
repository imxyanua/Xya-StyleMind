    delete:
      tags: [Products]
      summary: Delete product
      description: Admin only.
      operationId: deleteProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductIDPath'
      responses:
        '200':
          description: Product deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    ProductIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductIDPathProductID:
      name: product_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid payload, validation error, or invalid identifier/filter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: validation failed
    Unauthorized:
      description: Missing, invalid, expired, or revoked Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: unauthorized
    Forbidden:
      description: Authenticated user does not have permission for this resource/action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: forbidden
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: not found
    Conflict:
      description: Business conflict, such as duplicate product review.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: review already exists
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: too many requests
    InternalServerError:
      description: Unexpected server error. Response does not expose internal SQL/stack details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: internal server error
    ServiceUnavailable:
      description: Dependency unavailable or revocation store unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: logout failed
    HealthOK:
      description: Health check OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthResponseEnvelope'
  schemas:
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: validation failed
    PaginationMeta:
      type: object
      required: [page, limit, total, total_page, total_pages]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          format: int64
          example: 42
        total_page:
          type: integer
          format: int64
          description: Backward-compatible pagination field.
          example: 3
        total_pages:
          type: integer
          format: int64
          example: 3
    RegisterRequest:
      type: object
      required: [email, full_name, password]
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    AuthUser:
      type: object
      required: [id, email, full_name, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [user, admin]
    AuthData:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT access token. Examples use placeholders only.
          example: eyJhbGciOi...example
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthResponseEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: login success
        data:
          $ref: '#/components/schemas/AuthData'
    MeData:
      type: object
      required: [user_id, role]
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, admin]
    MeResponseEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: authorized
        data:
          $ref: '#/components/schemas/MeData'
    NullableSuccessEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: ok
        data:
          nullable: true
    Category:
      type: object
      required: [id, name, slug, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateCategoryRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        slug:
          type: string
          minLength: 2
          maxLength: 100
    CategoryResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Category'
    CategoryListResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    Product:
      type: object
      required: [id, name, description, price, stock, category_id, style, color, image_url, average_rating, review_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
          example: 300000
        stock:
          type: integer
          minimum: 0
        category_id:
          type: string
          format: uuid
        style:
          type: string
          example: streetwear
        color:
          type: string
          example: black
        image_url:
          type: string
          format: uri
        average_rating:
          type: number
          format: double
          example: 4.5
        review_count:
          type: integer
          format: int64
          example: 2
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductMutationRequest:
      type: object
      required: [name, description, price, stock, category_id, style, color, image_url]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
        description:
          type: string
          minLength: 5
          maxLength: 5000
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 300000
        stock:
          type: integer
          minimum: 0
        category_id:
          type: string
          format: uuid
        style:
          type: string
          minLength: 2
          maxLength: 100
        color:
          type: string
          minLength: 2
          maxLength: 100
        image_url:
          type: string
          format: uri
    ProductResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Product'
    ProductListResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CartProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: number
        stock:
          type: integer
        image_url:
          type: string
          format: uri
        style:
          type: string
        color:
          type: string
    CartItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product:
          $ref: '#/components/schemas/CartProduct'
        quantity:
          type: integer
          minimum: 1
        subtotal:
          type: number
    Cart:
      type: object
      properties:
        cart_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total:
          type: number
    AddCartItemRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
    CartResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Cart'
    OrderProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        image_url:
          type: string
          format: uri
        style:
          type: string
        color:
          type: string
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: number
        subtotal:
          type: number
        product:
          $ref: '#/components/schemas/OrderProduct'
    OrderUser:
      type: object
