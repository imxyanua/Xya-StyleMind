      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
    ProductIDResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            product_id:
              type: string
              format: uuid
    HealthData:
      type: object
      properties:
        status:
          type: string
          example: up
        service:
          type: string
          example: stylemind-backend
    HealthResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/HealthData'
    LivenessData:
      type: object
      properties:
        status:
          type: string
          example: up
    LivenessResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/LivenessData'
    DependencyStatus:
      type: object
      properties:
        status:
          type: string
          enum: [up, down, skipped]
    ReadinessData:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        dependencies:
          type: object
          properties:
            postgres:
              $ref: '#/components/schemas/DependencyStatus'
            redis:
              $ref: '#/components/schemas/DependencyStatus'
    ReadinessResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/ReadinessData'
