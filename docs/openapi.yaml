openapi: 3.0.3
info:
  title: Xya-StyleMind Backend API
  version: 0.1.0
  description: |
    OpenAPI contract for the Xya-StyleMind Go/Gin backend.

    All JSON API endpoints use the shared response shape:
    `{ success, message, data, meta }`.

    Authentication uses Bearer JWT access tokens. Admin endpoints require an
    authenticated user with role `admin`.
servers:
  - url: http://localhost:8080
    description: Local backend
  - url: http://localhost:8080/api/v1
    description: Local API v1 base path
tags:
  - name: Auth
  - name: Admin
  - name: Categories
  - name: Products
  - name: Cart
  - name: Orders
  - name: Wishlist
  - name: Reviews
  - name: Health
  - name: Metrics
security: []
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Public endpoint. Rate limited by IP and email.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                value:
                  email: user@example.com
                  full_name: Linh Nguyen
                  password: strongPassword123
      responses:
        '201':
          description: Register success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
              examples:
                default:
                  value:
                    success: true
                    message: register success
                    data:
                      token: eyJhbGciOi...example
                      user:
                        id: 5c3eb7aa-a3b8-4f1f-a9d4-1e4e4e2db222
                        email: user@example.com
                        full_name: Linh Nguyen
                        role: user
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/products/{product_id}/reviews:
    get:
      tags: [Reviews]
      summary: List product reviews
      operationId: listProductReviews
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductIDPathProductID'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Product reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Reviews]
      summary: Create product review
      description: Protected endpoint. User must have purchased the product. One review per user/product.
      operationId: createReview
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductIDPathProductID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
            examples:
              default:
                value:
                  order_id: 3d63c26a-7e3e-4b87-8457-3e04ce1df655
                  rating: 5
                  comment: Great quality and fit.
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/products/{product_id}/rating-summary:
    get:
      tags: [Reviews]
      summary: Get product rating summary
      operationId: getRatingSummary
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductIDPathProductID'
      responses:
        '200':
          description: Rating summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingSummaryResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/reviews/{id}:
    patch:
      tags: [Reviews]
      summary: Update current user's review
      operationId: updateReview
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReviewIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequest'
      responses:
        '200':
          description: Review updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Reviews]
      summary: Delete current user's review
      operationId: deleteReview
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReviewIDPath'
      responses:
        '200':
          description: Review deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health:
    get:
      tags: [Health]
      summary: Lightweight health check
      operationId: healthLegacyRoot
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthOK'
  /healthz:
    get:
      tags: [Health]
      summary: Lightweight health check
      operationId: healthz
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthOK'
  /livez:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: livez
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponseEnvelope'
  /readyz:
    get:
      tags: [Health]
      summary: Readiness check
      operationId: readyz
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponseEnvelope'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponseEnvelope'
  /api/v1/health:
    get:
      tags: [Health]
      summary: Backward-compatible API health check
      operationId: apiHealth
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthOK'
  /metrics:
    get:
      tags: [Metrics]
      summary: Prometheus metrics
      description: Public in local/dev. In production, expose only via internal network or reverse proxy allowlist.
      operationId: metrics
      security: []
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  value: |
                    # HELP http_requests_total Total HTTP requests.
                    # TYPE http_requests_total counter
                    http_requests_total{method="GET",route="/api/v1/products",status="200"} 1
  /api/v1/cart:
    get:
      tags: [Cart]
      summary: Get current user's cart
      operationId: getCart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/cart/items:
    post:
      tags: [Cart]
      summary: Add product to cart
      operationId: addCartItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
            examples:
              default:
                value:
                  product_id: 29711c9a-5f7d-4ddf-ad71-07d740f398db
                  quantity: 2
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/cart/items/{id}:
    put:
      tags: [Cart]
      summary: Update cart item quantity
      operationId: updateCartItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Cart]
      summary: Remove cart item
      operationId: deleteCartItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Checkout current cart into an order
      operationId: checkout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            examples:
              default:
                value:
                  recipient_name: Nguyen Van A
                  phone: '0901234567'
                  address_line: 123 Nguyen Trai
                  city: Ho Chi Minh City
                  district: District 1
                  note: Call before delivery
                  shipping_method: standard
                  payment_method: cod
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Orders]
      summary: List current user's orders
      operationId: listMyOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: User orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Get one of the current user's orders
      operationId: getMyOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIDPath'
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/orders:
    get:
      tags: [Orders]
      summary: List all orders
      description: Admin only.
      operationId: listAdminOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: q
          in: query
          description: Search by order id.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, shipping, completed, cancelled]
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Created-at start date or RFC3339 timestamp.
          schema:
            type: string
        - name: to
          in: query
          description: Created-at end date or RFC3339 timestamp.
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        '200':
          description: All orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/orders/{id}:
    get:
      tags: [Orders]
      summary: Get any order
      description: Admin only.
      operationId: getAdminOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIDPath'
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status
      description: Admin only. Allowed statuses are pending, paid, shipping, completed, cancelled.
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
            examples:
              default:
                value:
                  status: paid
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: List users
      description: Admin only. Returns safe user profiles without password hashes, tokens, or secrets.
      operationId: listAdminUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: q
          in: query
          description: Search by email or full name.
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [user, admin]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled]
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponseEnvelope'
              examples:
                default:
                  value:
                    success: true
                    message: ok
                    data:
                      - id: 5c3eb7aa-a3b8-4f1f-a9d4-1e4e4e2db222
                        email: user@example.com
                        full_name: Linh Nguyen
                        role: user
                        status: active
                        created_at: '2026-06-06T05:00:00Z'
                        updated_at: '2026-06-06T05:00:00Z'
                    meta:
                      page: 1
                      limit: 20
                      total: 1
                      total_page: 1
                      total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/users/{id}:
    get:
      tags: [Admin]
      summary: Get user detail
      description: Admin only. Does not expose password hashes, tokens, or secrets.
      operationId: getAdminUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIDPath'
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/users/{id}/role:
    patch:
      tags: [Admin]
      summary: Update user role
      description: Admin only. Role is allowlisted to `user` or `admin`. The last admin cannot demote themselves.
      operationId: updateAdminUserRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
            examples:
              promote:
                value:
                  role: admin
              demote:
                value:
                  role: user
      responses:
        '200':
          description: User role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/users/{id}/status:
    patch:
      tags: [Admin]
      summary: Update user status
      description: Admin only. Status is allowlisted to `active` or `disabled`. Admins cannot disable their own account, and the last active admin cannot be disabled.
      operationId: updateAdminUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
            examples:
              disable:
                value:
                  status: disabled
              enable:
                value:
                  status: active
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/dashboard/stats:
    get:
      tags: [Admin]
      summary: Get admin dashboard stats
      description: Admin only. Returns aggregate ecommerce metrics without exposing password hashes, tokens, or secrets.
      operationId: getAdminDashboardStats
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          description: Order created-at start date or RFC3339 timestamp.
          schema:
            type: string
        - name: to
          in: query
          description: Order created-at end date or RFC3339 timestamp.
          schema:
            type: string
      responses:
        '200':
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardStatsResponseEnvelope'
              examples:
                default:
                  value:
                    success: true
                    message: ok
                    data:
                      total_revenue: 3200000
                      total_orders: 12
                      total_products: 42
                      total_users: 18
                      orders_by_status:
                        pending: 3
                        paid: 2
                        shipping: 4
                        completed: 2
                        cancelled: 1
                      recent_orders:
                        - id: 293d2e5f-b11d-4f71-85bb-fc2325c06da2
                          user_id: 5c3eb7aa-a3b8-4f1f-a9d4-1e4e4e2db222
                          user_email: buyer@example.com
                          user_name: Example Buyer
                          status: paid
                          total_amount: 1200000
                          created_at: '2026-06-06T05:00:00Z'
                      low_stock_products:
                        - id: 85d4813e-b82f-4826-984d-f2df6c1997cf
                          name: Linen Overshirt
                          stock: 2
                          price: 890000
                          image_url: https://picsum.photos/seed/stylemind/640/800
                      revenue_by_day:
                        - date: '2026-06-06'
                          revenue: 3200000
                      top_products:
                        - id: 85d4813e-b82f-4826-984d-f2df6c1997cf
                          name: Linen Overshirt
                          image_url: https://picsum.photos/seed/stylemind/640/800
                          quantity_sold: 4
                          revenue: 3200000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
