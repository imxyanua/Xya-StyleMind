components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    ProductIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductIDPathProductID:
      name: product_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid payload, validation error, or invalid identifier/filter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: validation failed
    Unauthorized:
      description: Missing, invalid, expired, or revoked Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: unauthorized
    Forbidden:
      description: Authenticated user does not have permission for this resource/action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: forbidden
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: not found
    Conflict:
      description: Business conflict, such as duplicate product review.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: review already exists
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: too many requests
    InternalServerError:
      description: Unexpected server error. Response does not expose internal SQL/stack details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: internal server error
    ServiceUnavailable:
      description: Dependency unavailable or revocation store unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                message: logout failed
    HealthOK:
      description: Health check OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthResponseEnvelope'
  schemas:
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: validation failed
    PaginationMeta:
      type: object
      required: [page, limit, total, total_page, total_pages]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          format: int64
          example: 42
        total_page:
          type: integer
          format: int64
          description: Backward-compatible pagination field.
          example: 3
        total_pages:
          type: integer
          format: int64
          example: 3
    RegisterRequest:
      type: object
      required: [email, full_name, password]
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    AuthUser:
      type: object
      required: [id, email, full_name, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [user, admin]
    AuthData:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT access token. Examples use placeholders only.
          example: eyJhbGciOi...example
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthResponseEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
