openapi: 3.0.3
info:
  title: Xya-StyleMind Backend API
  version: 0.1.0
  description: |
    OpenAPI contract for the Xya-StyleMind Go/Gin backend.

    All JSON API endpoints use the shared response shape:
    `{ success, message, data, meta }`.

    Authentication uses Bearer JWT access tokens. Admin endpoints require an
    authenticated user with role `admin`.
servers:
  - url: http://localhost:8080
    description: Local backend
  - url: http://localhost:8080/api/v1
    description: Local API v1 base path
tags:
  - name: Auth
  - name: Categories
  - name: Products
  - name: Cart
  - name: Orders
  - name: Wishlist
  - name: Reviews
  - name: Health
  - name: Metrics
security: []
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Public endpoint. Rate limited by IP and email.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                value:
                  email: user@example.com
                  full_name: Linh Nguyen
                  password: strongPassword123
      responses:
        '201':
          description: Register success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
              examples:
                default:
                  value:
                    success: true
                    message: register success
                    data:
                      token: eyJhbGciOi...example
                      user:
                        id: 5c3eb7aa-a3b8-4f1f-a9d4-1e4e4e2db222
                        email: user@example.com
                        full_name: Linh Nguyen
                        role: user
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/products/{product_id}/reviews:
    get:
      tags: [Reviews]
      summary: List product reviews
      operationId: listProductReviews
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductIDPathProductID'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Product reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Reviews]
      summary: Create product review
      description: Protected endpoint. User must have purchased the product. One review per user/product.
      operationId: createReview
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductIDPathProductID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
            examples:
              default:
                value:
                  order_id: 3d63c26a-7e3e-4b87-8457-3e04ce1df655
                  rating: 5
                  comment: Great quality and fit.
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/products/{product_id}/rating-summary:
    get:
      tags: [Reviews]
      summary: Get product rating summary
      operationId: getRatingSummary
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductIDPathProductID'
      responses:
        '200':
          description: Rating summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingSummaryResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/reviews/{id}:
    patch:
      tags: [Reviews]
      summary: Update current user's review
      operationId: updateReview
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReviewIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequest'
      responses:
        '200':
          description: Review updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Reviews]
      summary: Delete current user's review
      operationId: deleteReview
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReviewIDPath'
      responses:
        '200':
          description: Review deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health:
    get:
      tags: [Health]
      summary: Lightweight health check
      operationId: healthLegacyRoot
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthOK'
  /healthz:
    get:
      tags: [Health]
      summary: Lightweight health check
      operationId: healthz
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthOK'
  /livez:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: livez
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponseEnvelope'
  /readyz:
    get:
      tags: [Health]
      summary: Readiness check
      operationId: readyz
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponseEnvelope'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponseEnvelope'
  /api/v1/health:
    get:
      tags: [Health]
      summary: Backward-compatible API health check
      operationId: apiHealth
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthOK'
  /metrics:
    get:
      tags: [Metrics]
      summary: Prometheus metrics
      description: Public in local/dev. In production, expose only via internal network or reverse proxy allowlist.
      operationId: metrics
      security: []
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  value: |
                    # HELP http_requests_total Total HTTP requests.
                    # TYPE http_requests_total counter
                    http_requests_total{method="GET",route="/api/v1/products",status="200"} 1
  /api/v1/cart:
    get:
      tags: [Cart]
      summary: Get current user's cart
      operationId: getCart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/cart/items:
    post:
      tags: [Cart]
      summary: Add product to cart
      operationId: addCartItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
            examples:
              default:
                value:
                  product_id: 29711c9a-5f7d-4ddf-ad71-07d740f398db
                  quantity: 2
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/cart/items/{id}:
    put:
      tags: [Cart]
      summary: Update cart item quantity
      operationId: updateCartItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Cart]
      summary: Remove cart item
      operationId: deleteCartItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Checkout current cart into an order
      operationId: checkout
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Orders]
      summary: List current user's orders
      operationId: listMyOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: User orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Get one of the current user's orders
      operationId: getMyOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIDPath'
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/orders:
    get:
      tags: [Orders]
      summary: List all orders
      description: Admin only.
      operationId: listAdminOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: q
          in: query
          description: Search by order id.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, shipping, completed, cancelled]
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Created-at start date or RFC3339 timestamp.
          schema:
            type: string
        - name: to
          in: query
          description: Created-at end date or RFC3339 timestamp.
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        '200':
          description: All orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/orders/{id}:
    get:
      tags: [Orders]
      summary: Get any order
      description: Admin only.
      operationId: getAdminOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIDPath'
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status
      description: Admin only. Allowed statuses are pending, paid, shipping, completed, cancelled.
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
            examples:
              default:
                value:
                  status: paid
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/wishlist:
    get:
      tags: [Wishlist]
      summary: List current user's wishlist
      operationId: listWishlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Wishlist items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/wishlist/products/{product_id}:
    post:
      tags: [Wishlist]
      summary: Add product to wishlist
      description: Idempotent; adding the same product again returns success and does not duplicate rows.
      operationId: addWishlistProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductIDPathProductID'
      responses:
        '200':
          description: Wishlist product added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductIDResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Wishlist]
      summary: Remove product from wishlist
      description: Idempotent; removing a missing wishlist product still returns success.
      operationId: removeWishlistProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductIDPathProductID'
      responses:
        '200':
          description: Wishlist product removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductIDResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and receive an access token
      description: Public endpoint. Rate limited by IP and email.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: user@example.com
                  password: strongPassword123
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current token
      description: Protected endpoint. Stores the token jti in the revocation store until token expiry.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullableSuccessEnvelope'
              examples:
                default:
                  value:
                    success: true
                    message: logout success
                    data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated principal
      operationId: me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponseEnvelope'
              examples:
                default:
                  value:
                    success: true
                    message: authorized
                    data:
                      user_id: 5c3eb7aa-a3b8-4f1f-a9d4-1e4e4e2db222
                      role: user
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/categories:
    get:
      tags: [Categories]
      summary: List categories
      operationId: listCategories
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/categories:
    post:
      tags: [Categories]
      summary: Create category
      description: Admin only.
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
            examples:
              default:
                value:
                  name: Streetwear
                  slug: streetwear
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/products:
    get:
      tags: [Products]
      summary: List/search/filter products
      operationId: listProducts
      security: []
      parameters:
        - name: q
          in: query
          description: Keyword search across product name and description.
          schema:
            type: string
          example: hoodie
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: min_price
          in: query
          schema:
            type: number
            minimum: 0
          example: 100000
        - name: max_price
          in: query
          schema:
            type: number
            minimum: 0
          example: 800000
        - name: style
          in: query
          schema:
            type: string
          example: streetwear
        - name: color
          in: query
          schema:
            type: string
          example: black
        - name: min_rating
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 5
          example: 4
        - name: in_stock
          in: query
          schema:
            type: boolean
          example: true
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc, rating_desc, popular]
            default: newest
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponseEnvelope'
              examples:
                default:
                  value:
                    success: true
                    message: ok
                    data:
                      - id: 29711c9a-5f7d-4ddf-ad71-07d740f398db
                        name: Black Street Hoodie
                        description: Oversized cotton hoodie
                        price: 300000
                        stock: 10
                        category_id: 8a51a2e7-c1f6-44e1-a5b1-5069e9bb241e
